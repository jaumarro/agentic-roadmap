name: Release

# Publishing a GitHub release for a tag vX.Y.Z publishes that version to npm. npm trusts this workflow by name
# (trusted publishing), so no npm token is stored anywhere, and the package carries provenance for the commit.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # The short-lived token npm trades for its own, in place of a stored secret.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: The tag names the version package.json has
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$version" ]; then
            echo "The release tag is $TAG but package.json says $version." >&2
            exit 1
          fi
      # A version published by hand, or by an earlier run, is left as it is, so a re-run passes.
      - name: The version is not on npm yet
        id: unpublished
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already on npm."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.unpublished.outputs.publish == 'true'
        run: npm publish --provenance --access public
