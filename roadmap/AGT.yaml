name: Agents follow it unprompted
tasks:
  - id: AGT.1
    title: A skill with today's workflow
    requires: [QRY.3]
    doneWhen: skill/SKILL.md tells an agent how to take the next task, branch, close it, ask the plan with show, why and list, and plan with check and health; every command it names exists and runs as it says
    lines: doc
  - id: AGT.2
    title: Install the skill in a repo, and prove an agent follows it
    requires: [AGT.1, COR.4, PAR.1]
    doneWhen: install-skill copies the skill into a repo's .claude/skills; the skill covers add and free; in a test repo with it installed, asking Claude for what is next and to do it makes it use next, name the branch after the task and close it, and asking it to plan a feature makes it add the tasks with add, run health and fix the worst problems
    lines: 40
