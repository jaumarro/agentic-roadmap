name: The core loop
tasks:
  - id: COR.1
    title: Set up the package with its tools and a CLI that prints its usage
    doneWhen: pnpm test, typecheck, lint and format:check pass on a CLI that prints its usage
    lines: 50
    commit: '283754d'
  - id: COR.2
    title: Start a roadmap with init and name the task to take with next
    requires: [COR.1]
    doneWhen: init in an empty folder, then next from a subfolder names the right task and its branch
    lines: 150
    commit: '47910e8'
  - id: COR.3
    title: Close a task with its commit, and check the plan
    requires: [COR.2]
    doneWhen: close writes the sha of the last non-docs commit, quoted, and next moves on; check fails on an unknown requirement, a repeated id or block, a cycle, an id outside its block and a sha this repo does not have; next refuses a plan check rejects and says why; next says when a branch already started the task
    lines: 150
    commit: '59f1e65'
  - id: COR.4
    title: Add a task with an id the tool picks
    requires: [COR.3]
    doneWhen: two branches that each add a task to the same block get different ids, and check passes after merging both
    lines: 120
    commit: '98eb237'
  - id: COR.5
    title: Clean errors, strict flags and no roadmap inside another
    requires: [COR.3]
    doneWhen: a YAML syntax error and a folder it cannot write end in a message with the file and line, never a stack trace, and init writes nothing half-done; --root with no value or with a flag fails; init under an existing roadmap refuses; next tells «all done», «no tasks» and «blocked» apart; --help exits 0
    lines: 100
    commit: 'b6fb0f3'
  - id: COR.6
    title: Merge two branches' block files by task id, so parallel adds and closes merge without asking
    requires: [COR.4]
    doneWhen: with merge-driver installed, two branches that each add a task to one block, and two that close different tasks in it, merge with no conflict and check passes; the same id changed on both sides still stops the merge
    lines: 80
    commit: '451f9b8'
  - id: COR.7
    title: Check the staged plan before each commit, with a pre-commit hook to install
    doneWhen: check --staged reads roadmap/ and the Markdown from the index; install-hook adds a pre-commit that runs it when they are staged, keeping any hook already there; a commit with a broken requires is refused
    lines: 60
    commit: '876ae55'
  - id: COR.8
    title: Never hand out an id another clone has or the block once had
    requires: [COR.4]
    doneWhen: add looks at remote branches too, and past the highest number ever used in the block's git history; a task deleted from the tip keeps its id from coming back
    lines: 20
  - id: COR.9
    title: Close a task with the newest work commit on its own branch
    requires: [COR.3]
    doneWhen: 'with no --commit, close takes the newest commit since the branch left its base that is not docs:, build: included, and never one from an earlier task already merged'
    lines: 20
    commit: 'f1aba94'
  - id: COR.10
    title: Add every task of a plan's roadmap table at once
    requires: [COR.4]
    doneWhen: add --from FILE reads the table under <!-- roadmap --> in a Markdown plan, gives each row an id the way add does, resolves keys in Requires to those ids, and writes all of them or, when check fails, none
    lines: 60
    commit: '4d92380'
  - id: COR.11
    title: init never deletes a block file it did not write
    requires: [COR.5]
    doneWhen: with roadmap/GET.yaml already there and no roadmap.yaml, init fails and leaves GET.yaml as it was
    lines: 10
    risky: true
    commit: '76d6b96'
  - id: COR.12
    title: Never hand out an id another worktree holds uncommitted
    requires: [COR.4]
    doneWhen: two worktrees that add to one block before committing get different ids; ids are taken under a lock in the shared git folder
    lines: 50
    risky: true
    commit: '9889b12'
  - id: COR.13
    title: add checks the plan with its chapters
    requires: [COR.4]
    doneWhen: add refuses a requirement on a later chapter, as check does
    lines: 5
    commit: '1b11314'
  - id: COR.14
    title: close names no commit the branch did not make
    requires: [COR.9]
    doneWhen: on a fresh task branch with no commit of its own, close without --commit refuses; a docs-only branch closes with its newest docs commit
    lines: 20
    risky: true
    commit: '88899f7'
  - id: COR.15
    title: check survives a cycle
    requires: [COR.3]
    doneWhen: check on a plan with a cycle in one block prints the cycle and exits 1, with no stack overflow; the pipe test passes on Node 24.1
    lines: 10
    commit: '8fd2611'
  - id: COR.16
    title: add reads other branches' blocks from the roadmap's own folder
    requires: [COR.12]
    doneWhen: with the plan in app/roadmap/, a GET.3 committed on another branch keeps add from giving GET.3 again
    lines: 10
    risky: true
    commit: '8e0ddad'
  - id: COR.17
    title: close bounds the task's commits by its base, not by every other branch
    requires: [COR.14]
    doneWhen: a backup branch at the task's tip leaves close taking the task's feat; a fresh branch from the base is still refused; a stacked branch takes only its own commits
    lines: 30
    risky: true
    commit: '0023d13'
  - id: COR.18
    title: Fetched remote branches count for ids and for started tasks
    requires: [COR.16]
    doneWhen: after fetching another clone's branch with GET.3, add gives GET.4, and a remote branch named after a task marks it started
    lines: 15
    risky: true
    commit: 'b0fde5e'
  - id: COR.19
    title: close takes a task's commits since the last close of another task
    requires: [COR.17]
    doneWhen: "close bounds the task's commits by its base and by the newest docs: close of another task: a pushed copy of the branch never hides its feat, a fresh stacked branch is refused, and a base: that names no branch fails with that said"
    lines: 30
    commit: '53dc618'
  - id: COR.20
    title: A merge the driver cannot settle leaves both sides marked
    requires: [COR.6]
    doneWhen: a task both branches changed leaves conflict markers with both versions, and roadmap.yaml merges as text, never through the block driver
    lines: 20
    risky: true
    commit: 'eae65fe'
  - id: COR.21
    title: close refuses when it can tell no base
    requires: [COR.19]
    doneWhen: 'with no base: set and none found, close without --commit refuses and asks for base: instead of taking older history'
    lines: 10
    risky: true
    commit: '3311f88'
  - id: COR.22
    title: check tells a commit lost to a squash or a shallow clone from a wrong one
    requires: [COR.3]
    doneWhen: in a shallow clone check warns instead of failing on cited commits it cannot see; the skill and reference say closes need a merge or fast-forward, and how to close after a squash
    lines: 20
    commit: '0eeec3b'
  - id: COR.23
    title: The hook and the merge driver survive an upgrade
    requires: [COR.7, COR.6]
    doneWhen: both call the installed bin by a path that stays across upgrades, and running an installer again rewrites a stale line
    lines: 30
    risky: true
    commit: 'a2a3db3'
  - id: COR.24
    title: install-merge-driver keeps a .gitattributes with no final newline intact
    requires: [COR.6]
    doneWhen: a .gitattributes ending without a newline keeps its last rule and gains the driver's on its own line
    lines: 5
    commit: '012a82c'
  - id: COR.25
    title: Writing a block keeps its line endings and folded text
    requires: [COR.4]
    doneWhen: close and add on a CRLF block keep CRLF, and a folded >- scalar stays folded
    lines: 20
  - id: COR.26
    title: close prefers the commit that fits the task over tooling commits
    requires: [COR.19]
    doneWhen: 'a feat, fix, refactor or perf commit wins over a newer build: one, and a doc-only task takes its newest docs: commit that is no close over a build: one'
    lines: 15
    commit: 'eca032b'
