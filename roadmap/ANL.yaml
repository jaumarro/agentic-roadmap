name: Read the plan's shape
tasks:
  - id: ANL.1
    title: Order next and free by focus, then by how much work each task unblocks
    requires: [QRY.3, PAR.3]
    doneWhen: one analysis gives each task its wave, bottom level and float; health prints the same figures; a small task off the critical path no longer goes ahead of one on it
    lines: 80
    commit: '260a7b0'
  - id: ANL.2
    title: List the pending tasks by wave, critical ones marked
    requires: [ANL.1, QRY.2]
    doneWhen: list --by wave groups the tasks not done by wave, focused first within each, critical marked, parallel tracks apart, with --state and --json as for list
    lines: 30
    commit: 'd089a9b'
  - id: ANL.3
    title: Warn when free hands out more tasks than the plan keeps busy
    requires: [PAR.1, QRY.3]
    doneWhen: free N with N over the plan's width says how many sessions it keeps busy
    lines: 10
    commit: '02ea856'
  - id: ANL.4
    title: Compare each closed task's estimate with the lines its commit changed
    requires: [QRY.3]
    doneWhen: health says how far estimates fall from the lines the closing commits changed, by block, and health --json gives the figures
    lines: 40
  - id: ANL.6
    title: Give the dependency graph as Mermaid or JSON
    requires: [ANL.1]
    doneWhen: graph --mermaid prints a flowchart with each task's state and critical ones marked, a parallel track as its own subgraph; graph --json gives nodes and edges with state, wave and critical
    lines: 50
    commit: '3dc6c3e'
  - id: ANL.7
    title: Flag a bottleneck only on or near the critical path, and advise a split only for a large one
    doneWhen: a waiting task most of the plan waits on gives no health problem while its slack is over a tenth of the critical path; one on the path or under that slack does, saying split only when it is over half the task size cap
    lines: 40
    commit: '834bd55'
  - id: ANL.8
    title: Ask about each requirement whose absence would shorten the critical path
    doneWhen: health asks about the largest savings, as Does A need B? Without it, ~N lines shorter, health --json gives them all, and nothing is written
    lines: 90
    commit: '45b7b74'
  - id: ANL.9
    title: Leave Across blocks out of health's text
    doneWhen: health prints no Across blocks line and health --json still gives crossBlockShare
    lines: 10
    commit: 'e6300ec'
  - id: ANL.10
    title: Show each task's slack in list --by wave
    doneWhen: list --by wave prints each task's slack in lines, none for a critical one, and --json gives it as slack
    lines: 30
    commit: '739e5cf'
  - id: ANL.11
    title: Say that a requirement on a later block does not fail check
    doneWhen: the health problem for a requirement on a later block says check does not fail on it, beside reordering the blocks
    lines: 10
    commit: '8e74804'
  - id: ANL.12
    title: Warn by default only of an empty block or one over 25 tasks
    doneWhen: a plan with blocks of 1 to 25 tasks gives no block-size warning with no warnings set, and init's example gives none
    lines: 15
    commit: '18b8684'
  - id: ANL.13
    title: Simulate the plan worked by N sessions
    requires: [ANL.10]
    doneWhen: health --sessions 4 says how much work-time the plan takes with 4 sessions and how much of it they sit idle, as text and as JSON
    lines: 120
  - id: ANL.14
    title: Mark a requirement as confirmed, so health stops asking about it
    doneWhen: a requirement listed under a task's confirmed is left out of health's questions and of savings, and one that names no requirement of the task fails check
    lines: 50
