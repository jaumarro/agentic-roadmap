name: Read the plan's shape
tasks:
  - id: ANL.1
    title: Order next and free by focus, then by how much work each task unblocks
    requires: [QRY.3, PAR.3]
    doneWhen: one analysis gives each task its wave, bottom level and float; health prints the same figures; a small task off the critical path no longer goes ahead of one on it
    lines: 80
    commit: '260a7b0'
  - id: ANL.2
    title: List the pending tasks by wave, critical ones marked
    requires: [ANL.1, QRY.2]
    doneWhen: list --by wave groups the tasks not done by wave, focused first within each, critical marked, parallel tracks apart, with --state and --json as for list
    lines: 30
    commit: 'd089a9b'
  - id: ANL.3
    title: Warn when free hands out more tasks than the plan keeps busy
    requires: [PAR.1, QRY.3]
    doneWhen: free N with N over the plan's width says how many sessions it keeps busy
    lines: 10
    commit: '02ea856'
  - id: ANL.4
    title: Compare each closed task's estimate with the lines its commit changed
    requires: [QRY.3]
    doneWhen: health says how far estimates fall from the lines the closing commits changed, by block, and health --json gives the figures
    lines: 40
  - id: ANL.6
    title: Give the dependency graph as Mermaid or JSON
    requires: [ANL.1]
    doneWhen: graph --mermaid prints a flowchart with each task's state and critical ones marked, a parallel track as its own subgraph; graph --json gives nodes and edges with state, wave and critical
    lines: 50
    commit: '3dc6c3e'
