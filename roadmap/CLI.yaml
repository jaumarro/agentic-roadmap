name: A CLI like any other
tasks:
  - id: CLI.1
    title: Write errors to stderr, so output stays parseable
    requires: [COR.5]
    doneWhen: every error goes to stderr with a non-zero exit, stdout carries only the answer, and next --json piped into a JSON reader never sees an error line
    lines: 15
    commit: '6f9383c'
  - id: CLI.2
    title: Print the version, and each command's own help
    requires: [COR.5]
    doneWhen: --version prints the package's version; <command> --help prints that command's usage and options, not the whole list
    lines: 40
    commit: 'f2106c4'
  - id: CLI.3
    title: Run on the Node versions still supported, not only the newest
    requires: [REV.1]
    doneWhen: engines asks for Node 20 or later, and the built CLI passes its tests and runs next and graph on Node 20
    lines: 5
    commit: '2b06ca2'
  - id: CLI.4
    title: Run when started through a symlink
    requires: [CLI.2]
    doneWhen: roadmap --help through a symlink to the built CLI prints the usage
    lines: 10
    commit: 'b6d0623'
  - id: CLI.5
    title: close names an unknown task before it looks for a commit
    requires: [COR.5]
    doneWhen: close NOPE.1 says there is no task NOPE.1
    lines: 5
    commit: '3959521'
  - id: CLI.6
    title: Build on a git install whatever the package manager
    requires: [REV.1]
    doneWhen: prepare runs tsc directly, so npm can install it from git without pnpm
    lines: 2
    commit: '38ec2e5'
  - id: CLI.7
    title: Work on git older than 2.31
    requires: [COR.12]
    doneWhen: without --path-format, add still takes the lock and install-hook finds the repo
    lines: 10
  - id: CLI.8
    title: Validate the plan without zod
    requires: [COR.5]
    doneWhen: the schemas are checked by hand with the same messages, zod is gone from dependencies, and the error tests pass unchanged
    lines: 100
    commit: '7483f78'
