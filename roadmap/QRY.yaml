name: Ask the whole plan
tasks:
  - id: QRY.1
    title: Show a task and why it is not ready
    requires: [COR.3]
    doneWhen: show ID gives its block, done when, requirements with their state, what it unblocks, and its commit or branch; why ID walks the requirements not done down to the ones ready to take; both with --json
    lines: 120
    commit: '31de877'
  - id: QRY.2
    title: List the plan with filters
    requires: [QRY.1]
    doneWhen: list gives every task with its state, and --block, --state ready|done|started|waiting narrow it; --json gives the same rows
    lines: 80
    commit: '3b327ce'
  - id: QRY.3
    title: Measure the plan's health, so whoever writes it can tell whether it got better
    requires: [QRY.1]
    doneWhen: health gives the critical path weighted by lines, the average parallelism, the widest set of tasks that can run at once, the tasks blocking most of the plan, the requires a longer path already implies, the share of requires across blocks and the tasks over the size cap; it ranks the 3 to 5 worst problems with the task or block to fix; --json gives the same; --strict fails past the thresholds
    lines: 150
  - id: QRY.4
    title: Compare the plan's health with another branch
    requires: [QRY.3]
    doneWhen: health --against main shows each metric before and after, reading the other branch's roadmap from git without checking it out, and names what got worse
    lines: 80
  - id: QRY.5
    title: Say what adding a task did to the plan's health
    requires: [QRY.3, COR.4]
    doneWhen: add ends with the change it made, as «critical path 8 → 9 · parallelism 3.1 → 2.8», and names any problem it brought in
    lines: 40
